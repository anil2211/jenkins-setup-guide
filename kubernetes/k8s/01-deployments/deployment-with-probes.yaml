apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-probes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp-probes
  template:
    metadata:
      labels:
        app: myapp-probes
    spec:
      containers:
      - name: myapp
        image: nginx:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10